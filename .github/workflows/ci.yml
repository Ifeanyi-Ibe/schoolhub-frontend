name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck, lint, format, API drift, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: API client drift (contract, generated types, operation manifest)
        run: npm run api:check
      - run: npm run test

  build:
    name: production build and bundle budgets
    needs: quality
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: ${{ vars.API_BASE_URL || 'http://localhost:5152' }}
      BFF_API_KEY: ${{ secrets.BFF_API_KEY_CI || 'ci-only-placeholder-key-0001' }}
      APP_BASE_DOMAIN: localhost
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: .next/standalone
          retention-days: 3

  e2e:
    name: axe checks (Playwright)
    needs: quality
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:5152
      BFF_API_KEY: ci-only-placeholder-key-0001
      APP_BASE_DOMAIN: localhost
      APP_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile, throttled 4G)
    needs: build
    runs-on: ubuntu-latest
    env:
      API_BASE_URL: http://localhost:5152
      BFF_API_KEY: ci-only-placeholder-key-0001
      APP_BASE_DOMAIN: localhost
      APP_ORIGIN: http://localhost:3100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lhci
