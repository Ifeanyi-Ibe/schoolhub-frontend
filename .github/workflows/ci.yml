name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck, lint, format, API drift, audit, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: API client drift (contract, generated types, operation manifest)
        run: npm run api:check
      - name: Production dependency advisories
        run: npm run audit:prod
      - run: npm run test

  build:
    name: production build and bundle budgets
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: First-load JavaScript budgets (signed-out and signed-in routes)
        run: npm run size
      - uses: actions/upload-artifact@v4
        with:
          name: standalone
          path: .next/standalone
          retention-days: 3

  e2e:
    name: end-to-end journeys and accessibility (production build)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  e2e-engines:
    name: WebKit and Firefox critical journeys (official Playwright image, Linux)
    # WebKit cannot run pages on macOS (Playwright 1.65.1 build). The official image pins the browsers and fonts.
    needs: quality
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e:engines
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-engines
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (sign-in and signed-in shell, mobile, throttled)
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lhci
