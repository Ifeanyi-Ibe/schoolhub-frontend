<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SchoolHub is offline. Pages you already opened still work." />
    <title>You are offline · SchoolHub</title>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <!-- Static fallback served by the service worker. Styles are inline so the page renders without a
         second request. This file is outside the proxy matcher, so it has no CSP header, and it has
         no script at all. -->
    <style>
      :root {
        color-scheme: light dark;
        --background: #f6f7f9;
        --foreground: #111827;
        --muted-foreground: #4b5563;
        --brand: #0f5c4d;
        --on-brand: #ffffff;
        --ring: #1d4ed8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --background: #0b1220;
          --foreground: #e5e7eb;
          --muted-foreground: #aab4c3;
          --brand: #2dd4bf;
          --on-brand: #042f2e;
          --ring: #60a5fa;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        background: var(--background);
        color: var(--foreground);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .offline {
        max-width: 36rem;
        margin: 0 auto;
        padding: 3rem 1rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      .offline h1 {
        font-size: 1.5rem;
        margin: 0;
      }
      .offline p {
        margin: 0;
        color: var(--muted-foreground);
        line-height: 1.5;
      }
      .offline__action {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        padding: 0 1rem;
        border-radius: 0.625rem;
        background: var(--brand);
        color: var(--on-brand);
        font-weight: 600;
        text-decoration: none;
      }
      .offline__action:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main class="offline">
      <h1>You are offline</h1>
      <p>
        You can keep working on pages you have already opened. Anything that needs the network will
        wait until you reconnect.
      </p>
      <p>
        <a href="/" class="offline__action">Try again</a>
      </p>
    </main>
  </body>
</html>
